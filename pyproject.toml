[project]
name = "sani"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.0",
    "edge-tts>=7.2.8",
    "google-genai>=2.18.1",
    "kokoro-onnx>=0.5.0",
    "miniaudio>=1.71",
    "numpy>=2.5.2",
    "openai>=2.54.0",
    "openai-agents>=0.20.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
]

[project.scripts]
sani = "sani:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
